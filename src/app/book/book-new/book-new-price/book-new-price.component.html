@if (form$ | async; as form) {
  <form [formGroup]="form" ngxsForm="BookCollection.new.price" (ngSubmit)="submit()" class="book-new__form">
    <mat-form-field>
      <mat-label>Price</mat-label>
      <input matInput type="number" formControlName="price" placeholder="PRICE" />
      @if (form.hasError('min', 'price')) {
        <mat-error> Price has to be at least {{ minPrice }}. </mat-error>
      }

      @if (form.hasError('required', 'price')) {
        <mat-error> Price is required </mat-error>
      }
    </mat-form-field>

    <div class="form-actions">
      <button mat-button routerLink="/" type="button">Cancel</button>
      <button mat-raised-button color="primary" [disabled]="!form.valid" type="submit">Save</button>
    </div>
  </form>
}
